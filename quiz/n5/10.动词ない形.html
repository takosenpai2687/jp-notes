<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="quiz-version" content="ea4a3535ac8c" />
<title>JLPT 语法小测</title>
<style>
  :root {
    --bg: #fff7f9;
    --card: #ffffff;
    --ink: #3d3550;
    --muted: #9b8fb0;
    --accent: #ff6f9c;
    --accent2: #a18cff;
    --accent-soft: #ffe8f0;
    --ok: #3fc47d;
    --ok-soft: #e6fbee;
    --bad: #ff7d6e;
    --bad-soft: #fff0ec;
    --line: #f4e8f0;
    --radius: 22px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background:
      radial-gradient(circle at 12% 8%, #ffe4ef 0%, transparent 34%),
      radial-gradient(circle at 92% 16%, #e6e1ff 0%, transparent 36%),
      radial-gradient(circle at 50% 100%, #ffe9c7 0%, transparent 40%),
      var(--bg);
    color: var(--ink);
    line-height: 1.6;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 18px 88px; }

  /* header */
  .head { text-align: center; margin-bottom: 20px; }
  .mascot { font-size: 46px; display: inline-block; animation: bob 2.6s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-8px) rotate(3deg)} }
  /* breadcrumb (level + lesson) */
  .crumbs { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .crumbs .crumb {
    display: inline-flex; align-items: center;
    font-size: 15px; font-weight: 900; letter-spacing: .04em;
    color: #fff; background: linear-gradient(120deg, var(--accent), var(--accent2));
    padding: 6px 16px; border-radius: 999px;
    box-shadow: 0 4px 12px rgba(255,111,156,.30);
  }
  .crumbs .crumb.plain {
    background: #fff; color: var(--accent2);
    border: 2px solid var(--accent2); box-shadow: none;
  }
  .crumbs .sep { color: var(--muted); font-weight: 900; font-size: 18px; }
  h1 { font-size: 27px; font-weight: 900; letter-spacing: .01em; margin-top: 10px; }
  .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

  /* progress */
  .progress { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .bar { flex: 1; height: 14px; border-radius: 999px; background: #ffeef5; overflow: hidden; box-shadow: inset 0 2px 4px rgba(255,111,156,.15); }
  .fill { height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .4s cubic-bezier(.22,1,.36,1); }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 700; }

  /* summary */
  .summary {
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 20px 22px; margin-bottom: 22px; box-shadow: 0 8px 24px rgba(161,140,255,.10);
  }
  .summary h2 { font-size: 14px; color: var(--accent2); font-weight: 900; letter-spacing: .05em; margin-bottom: 10px; }
  .summary li { margin: 8px 0 8px 22px; font-size: 15px; }
  .summary li::marker { color: var(--accent); }
  .summary b { color: var(--accent); }

  /* question card */
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(255,111,156,.10);
    animation: pop .45s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .qnum { font-size: 13px; font-weight: 900; color: var(--accent); letter-spacing: .08em; margin-bottom: 8px; }
  .qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .qhead .qnum { margin-bottom: 0; }
  .src {
    font-size: 12px; font-weight: 700; color: var(--accent2);
    background: var(--accent-soft); padding: 3px 10px; border-radius: 999px;
  }
  .stem { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .stem .blank { display: inline-block; min-width: 72px; border-bottom: 3px dotted var(--accent); text-align: center; padding: 0 4px; color: var(--accent); }

  .opts { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px; text-align: left;
    border: 2px solid var(--line); background: #fff; border-radius: 16px;
    padding: 12px 14px; font-size: 16px; cursor: pointer; font-family: inherit;
    transition: transform .16s cubic-bezier(.34,1.56,.64,1), border-color .16s ease, background .16s ease, box-shadow .16s ease;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent2); transform: translateY(-2px) scale(1.01); box-shadow: 0 8px 18px rgba(161,140,255,.18); }
  .opt .key {
    flex: none; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; font-weight: 900;
    display: grid; place-items: center; background: #fdf1f6; color: var(--accent);
  }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.correct .key { background: var(--ok); color: #fff; }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .35s ease; }
  .opt.wrong .key { background: var(--bad); color: #fff; }
  @keyframes shake { 0%,100%{transform:none} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .opt:disabled { cursor: default; }

  /* explanation */
  .explain { display: none; margin-top: 16px; padding: 15px 17px; border-radius: 16px; font-size: 14.5px; }
  .explain.show { display: block; animation: pop .3s cubic-bezier(.34,1.56,.64,1) both; }
  .explain .headline { font-weight: 900; margin-bottom: 4px; }
  .explain .trans {
    display: flex; align-items: center; gap: 10px;
    margin: 8px 0 6px; padding: 9px 13px;
    border-radius: 11px; background: rgba(255,255,255,.72);
    border: 1.5px dashed var(--accent);
    font-weight: 700; font-size: 15px; color: var(--ink);
  }
  .explain .trans .tlbl {
    flex: none; font-size: 12px; font-weight: 900; letter-spacing: .04em;
    color: #fff; background: linear-gradient(120deg, var(--accent), var(--accent2));
    padding: 3px 9px; border-radius: 999px;
  }
  .explain.ok { background: var(--ok-soft); } .explain.ok .headline { color: var(--ok); }
  .explain.no { background: var(--bad-soft); } .explain.no .headline { color: var(--bad); }
  .explain .tip { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .next { margin-top: 16px; width: 100%; padding: 13px; border: none; border-radius: 16px;
    background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; font-family: inherit;
    box-shadow: 0 6px 16px rgba(255,111,156,.35); transition: transform .16s cubic-bezier(.34,1.56,.64,1), filter .16s; }
  .next:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .next:not(:disabled):hover { transform: translateY(-2px); filter: brightness(1.05); }

  /* result */
  .result { text-align: center; padding: 40px 24px; animation: pop .5s cubic-bezier(.34,1.56,.64,1) both; }
  .result .mascot { font-size: 60px; margin-bottom: 6px; }
  .ring { width: 136px; height: 136px; margin: 4px auto 18px; }
  .ring .bg { fill: none; stroke: #ffeef5; stroke-width: 12; }
  .ring .val { fill: none; stroke: var(--accent); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s cubic-bezier(.22,1,.36,1); }
  .ring text { font-size: 30px; font-weight: 900; fill: var(--ink); }
  .result h2 { font-size: 22px; margin-bottom: 6px; }
  .result p { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .again { padding: 12px 30px; border: none; border-radius: 16px; background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #fff; font-size: 15px; font-weight: 900; cursor: pointer; font-family: inherit; box-shadow: 0 6px 16px rgba(255,111,156,.35); transition: transform .16s cubic-bezier(.34,1.56,.64,1); }
  .again:hover { transform: translateY(-2px) scale(1.03); }

  /* version marker */
  .ver { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; opacity: .75; }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="mascot">🌸</span>
    <br />
    <nav class="crumbs" id="crumbs"></nav>
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="progress">
    <span class="count" id="count"></span>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>

  <section class="summary">
    <h2>知识点速览</h2>
    <ul id="summary"></ul>
  </section>

  <div id="quiz"></div>
  <div id="result" class="result" style="display:none"></div>
  <div class="ver" id="ver"></div>
</div>

<script>
const QUIZ = {"title":"动词ない形","level":"N5","no":"10","subtitle":"基于笔记 notes/raw/n5/10.动词ない形.md","summary":["ない形表示否定；一类动词う段→あ段＋ない（う→わ），二类去る＋ない，三类する→しない・来る→こない。","ないで表示「没…的状态下…」；なくて表示对立「不…而…」或因果「因为不…」。","ないでください接在ない形后，表示「请不要做…」。","なくてもいいです接在ない形后，表示「不必…」。","ないといけません接在ない形后，表示「不…就不行；必须…」（いけません可省略）。","なければなりません接在ない形后，表示「不…就不行；必须…」（可省略为なきゃ）。"],"questions":[{"stem":"言う（いう） → ＿＿＿","source":"变形表·言う","options":["言わない（いわない）","言いない（いいない）","言うない（いうない）","言らない（いらない）"],"answer":0,"explain":"一类动词「言う」词尾う要特变为わ，再接ない，即「言わない」。","translation":"言う（说）→ 言わない（不说）","tip":"う段→あ段时「う」特变为「わ」，不要写成「言あない」。"},{"stem":"書く（かく） → ＿＿＿","source":"变形表·書く","options":["書かない（かかない）","書きない（かきない）","書くない（かくない）","書けない（かけない）"],"answer":0,"explain":"一类动词「書く」词尾く变か段再接ない，即「書かない」。","translation":"書く（写）→ 書かない（不写）","tip":"一类动词く→か＋ない。"},{"stem":"話す（はなす） → ＿＿＿","source":"变形表·話す","options":["話さない（はなさない）","話しない（はなしない）","話すない（はなすない）","話せない（はなせない）"],"answer":0,"explain":"一类动词「話す」词尾す变さ段再接ない，即「話さない」。","translation":"話す（说）→ 話さない（不说）","tip":"一类动词す→さ＋ない。"},{"stem":"待つ（まつ） → ＿＿＿","source":"变形表·待つ","options":["待たない（またない）","待ちない（まちない）","待つない（まつない）","待てない（まてない）"],"answer":0,"explain":"一类动词「待つ」词尾つ变た段再接ない，即「待たない」。","translation":"待つ（等）→ 待たない（不等）","tip":"一类动词つ→た＋ない。"},{"stem":"死ぬ（しぬ） → ＿＿＿","source":"变形表·死ぬ","options":["死なない（しなない）","死にない（しにない）","死ぬない（しぬない）","死ねない（しねない）"],"answer":0,"explain":"一类动词「死ぬ」词尾ぬ变な段再接ない，即「死なない」。","translation":"死ぬ（死）→ 死なない（不死）","tip":"一类动词ぬ→な＋ない。"},{"stem":"飛ぶ（とぶ） → ＿＿＿","source":"变形表·飛ぶ","options":["飛ばない（とばない）","飛びない（とびない）","飛ぶない（とぶない）","飛べない（とべない）"],"answer":0,"explain":"一类动词「飛ぶ」词尾ぶ变ば段再接ない，即「飛ばない」。","translation":"飛ぶ（飞）→ 飛ばない（不飞）","tip":"一类动词ぶ→ば＋ない。"},{"stem":"飲む（のむ） → ＿＿＿","source":"变形表·飲む","options":["飲まない（のまない）","飲みない（のみない）","飲むない（のむない）","飲めない（のめない）"],"answer":0,"explain":"一类动词「飲む」词尾む变ま段再接ない，即「飲まない」。","translation":"飲む（喝）→ 飲まない（不喝）","tip":"一类动词む→ま＋ない。"},{"stem":"送る（おくる） → ＿＿＿","source":"变形表·送る","options":["送らない（おくらない）","送りない（おくりない）","送るない（おくるない）","送れない（おくれない）"],"answer":0,"explain":"一类动词「送る」词尾る变ら段再接ない，即「送らない」。","translation":"送る（送）→ 送らない（不送）","tip":"一类动词る→ら＋ない。"},{"stem":"泳ぐ（およぐ） → ＿＿＿","source":"变形表·泳ぐ","options":["泳がない（およがない）","泳ぎない（およぎない）","泳ぐない（およぐない）","泳げない（およげない）"],"answer":0,"explain":"一类动词「泳ぐ」词尾ぐ变が段再接ない，即「泳がない」。","translation":"泳ぐ（游泳）→ 泳がない（不游泳）","tip":"一类动词ぐ→が＋ない。"},{"stem":"見る（みる） → ＿＿＿","source":"变形表·見る","options":["見ない（みない）","見らない（みらない）","見るない（みるない）","見れない（みれない）"],"answer":0,"explain":"二类动词「見る」去掉る再加ない，即「見ない」。","translation":"見る（看）→ 見ない（不看）","tip":"二类动词直接去る＋ない，勿按一类变「見らない」。"},{"stem":"食べる（たべる） → ＿＿＿","source":"变形表·食べる","options":["食べない（たべない）","食べらない（たべらない）","食べるない（たべるない）","食べれない（たべれない）"],"answer":0,"explain":"二类动词「食べる」去掉る再加ない，即「食べない」。","translation":"食べる（吃）→ 食べない（不吃）","tip":"二类动词去る＋ない，勿按一类变「食べらない」。"},{"stem":"勉強（べんきょう）する → ＿＿＿","source":"变形表·勉強する","options":["勉強しない（べんきょうしない）","勉強すない（べんきょうすない）","勉強するない（べんきょうするない）","勉強しる（べんきょうしる）"],"answer":0,"explain":"三类动词「勉強する」的ない形是不规则变化「勉強しない」。","translation":"勉強する（学习）→ 勉強しない（不学习）","tip":"する→しない，是不规则变化。"},{"stem":"来る（くる） → ＿＿＿","source":"变形表·来る","options":["来ない（こない）","来るない（くるない）","来らない（こらない）","来たない（こたない）"],"answer":0,"explain":"三类动词「来る」的ない形是不规则变化「来ない（こない）」。","translation":"来る（来）→ 来ない（不来）","tip":"来る→来ない（こない），读音特殊要牢记。"},{"stem":"起きる（おきる） → ＿＿＿","source":"变形表·起きる","options":["起きない（おきない）","起きらない（おきらない）","起きるない（おきるない）","起きれない（おきれない）"],"answer":0,"explain":"二类动词「起きる」去掉る再加ない，即「起きない」。","translation":"起きる（起床）→ 起きない（不起床）","tip":"二类动词直接去る＋ない。"},{"stem":"行く（いく） → ＿＿＿","source":"变形表·行く","options":["行かない（いかない）","行きない（いきない）","行くない（いくない）","行けない（いけない）"],"answer":0,"explain":"一类动词「行く」词尾く变か段再接ない，即「行かない」。","translation":"行く（去）→ 行かない（不去）","tip":"一类动词く→か＋ない。"},{"stem":"帰る（かえる） → ＿＿＿","source":"变形表·帰る","options":["帰らない（かえらない）","帰りない（かえりない）","帰るない（かえるない）","帰れない（かえれない）"],"answer":0,"explain":"一类动词「帰る」词尾る变ら段再接ない，即「帰らない」。","translation":"帰る（回）→ 帰らない（不回）","tip":"一类动词る→ら＋ない。"},{"stem":"ある → ＿＿＿","source":"变形规则·特殊·ある","options":["ない","あらない","あるない","あたない"],"answer":0,"explain":"「ある」的ない形是不规则变化，直接变为「ない」。","translation":"ある（有）→ ない（没有）","tip":"「ある」表存在时的否定直接是「ない」，不是「あらない」。"},{"stem":"宿題をし＿＿＿ゲームばかりしている。【对立】（不做作业，光玩游戏。）","source":"相关句型①例句1·对立","options":["なくて","ないで","なくても","ないでください"],"answer":0,"explain":"句末标注【对立】表示「不…而…」，对立用法用「なくて」。","translation":"不做作业，光玩游戏。","tip":"对立/因果用「なくて」，否定状态才用「ないで」。"},{"stem":"日本語がわから＿＿＿、聞き取れません。【因果】（因为不懂日语，所以听不明白。）","source":"相关句型①例句2·因果","options":["なくて","ないで","なくても","ないでください"],"answer":0,"explain":"句末标注【因果】表示「因为不…」，因果用法用「なくて」。","translation":"因为不懂日语，所以听不明白。","tip":"「わからない」表原因时用「なくて」，不可用「ないで」。"},{"stem":"朝ご飯を食べ＿＿＿学校へ行った。【否定的状态】（没吃早饭就去学校了。）","source":"相关句型①例句3·否定的状态","options":["ないで","なくて","なくても","ないでください"],"answer":0,"explain":"句末标注【否定的状态】表示「没…的状态下…」，用「ないで」。","translation":"没吃早饭就去学校了。","tip":"表示「没做…就…」的伴随状态用「ないで」。"},{"stem":"朝起きられ＿＿＿、授業に遅(おく)れた。【因果】（早上没能起来，上课迟到了。）","source":"相关句型①例句4·因果","options":["なくて","ないで","なくても","ないでください"],"answer":0,"explain":"句末标注【因果】表示「因为不…」，因果用法用「なくて」。","translation":"早上没能起来，上课迟到了。","tip":"前后为原因与结果关系时用「なくて」。"},{"stem":"何も食べ＿＿＿体重(たいじゅう)が３キロ減った。【因果】（什么都不吃，体重减轻了3公斤。）","source":"相关句型①例句5·因果","options":["なくて","ないで","なくても","ないでください"],"answer":0,"explain":"句末标注【因果】表示「因为不…」，因果用法用「なくて」。","translation":"什么都不吃，体重减轻了3公斤。","tip":"表原因结果用「なくて」。"},{"stem":"文句(もんく)を言わ＿＿＿部屋を片付(かたづ)けました。【否定的状态】（没有发牢骚，收拾好了房间。）","source":"相关句型①例句6·否定的状态","options":["ないで","なくて","なくても","ないでください"],"answer":0,"explain":"句末标注【否定的状态】表示「没…的状态下…」，用「ないで」。","translation":"没有发牢骚，收拾好了房间。","tip":"「不发牢骚地收拾房间」是伴随状态，用「ないで」。"},{"stem":"ここで写真を撮ら＿＿＿。（请不要在这里拍照。）","source":"相关句型②例句1","options":["ないでください","なくてもいいです","なければなりません","なくて"],"answer":0,"explain":"「ない形＋ないでください」表示「请不要做…」。","translation":"请不要在这里拍照。","tip":"「ないでください」是请求别人「不要…」。"},{"stem":"日本へ行か＿＿＿。（请不要去日本。）","source":"相关句型②例句2","options":["ないでください","なくてもいいです","なければなりません","なくて"],"answer":0,"explain":"「ない形＋ないでください」表示「请不要做…」。","translation":"请不要去日本。","tip":"动词ない形＋「ないでください」表禁止请求。"},{"stem":"私を離さ＿＿＿。（请不要放开我。）","source":"相关句型②例句3","options":["ないでください","なくてもいいです","なければなりません","なくて"],"answer":0,"explain":"「ない形＋ないでください」表示「请不要做…」。","translation":"请不要放开我。","tip":"「離す」的ない形是「離さない」，再加「ないでください」。"},{"stem":"明日は休みで、来＿＿＿。（明天休息，可以不用来。）","source":"相关句型③例句1","options":["なくてもいいです","ないでください","なければなりません","なくて"],"answer":0,"explain":"「ない形＋なくてもいいです」表示「不必…」。","translation":"明天休息，可以不用来。","tip":"「来る」的ない形是「来ない」→「来なくてもいいです」。"},{"stem":"李さんは大人ですから、心配し＿＿＿よ。（小李已经是大人了，不必担心哦。）","source":"相关句型③例句2","options":["なくてもいいです","ないでください","なければなりません","なくて"],"answer":0,"explain":"「ない形＋なくてもいいです」表示「不必…」。","translation":"小李已经是大人了，不必担心哦。","tip":"「心配する」的ない形是「心配しない」→「心配しなくてもいいです」。"},{"stem":"時間ですから、帰ら＿＿＿。（到时间了，必须得回去。）","source":"相关句型④例句1","options":["ないといけません","なくてもいいです","ないでください","なくて"],"answer":0,"explain":"「ない形＋ないといけません」表示「不…就不行；必须…」。","translation":"到时间了，必须得回去。","tip":"双重否定表必须，口语中「いけません」可省略为「帰らないと」。"},{"stem":"明日は試験があるから、もっと頑張ら＿＿＿。（明天有考试，必须更加努力。）","source":"相关句型④例句2","options":["ないといけません","なくてもいいです","ないでください","なくて"],"answer":0,"explain":"「ない形＋ないといけません」表示「不…就不行；必须…」。","translation":"明天有考试，必须更加努力。","tip":"「頑張る」的ない形是「頑張らない」→「頑張らないと（いけません）」。"},{"stem":"時間ですから、帰ら＿＿＿。（到时间了，必须得回去。）","source":"相关句型⑤例句1","options":["なければなりません","なくてもいいです","ないでください","なくて"],"answer":0,"explain":"「ない形＋なければなりません」表示「不…就不行；必须…」。","translation":"到时间了，必须得回去。","tip":"「なければなりません」口语中常省略为「帰らなきゃ」。"},{"stem":"明日は試験があるから、もっと頑張ら＿＿＿。（明天有考试，必须更加努力。）","source":"相关句型⑤例句2","options":["なければなりません","なくてもいいです","ないでください","なくて"],"answer":0,"explain":"「ない形＋なければなりません」表示「不…就不行；必须…」。","translation":"明天有考试，必须更加努力。","tip":"注意别写成「なけりば」，正确是「なければ」。"}],"version":"ea4a3535ac8c"};

const els = {
  crumbs: document.getElementById('crumbs'),
  title: document.getElementById('title'),
  sub: document.getElementById('sub'),
  count: document.getElementById('count'),
  fill: document.getElementById('fill'),
  summary: document.getElementById('summary'),
  quiz: document.getElementById('quiz'),
  result: document.getElementById('result'),
  ver: document.getElementById('ver'),
};

function renderSummary() {
  const level = QUIZ.level || '';
  const no = QUIZ.no || '';
  const parts = [];
  if (level) parts.push(`<span class="crumb">${level}</span>`);
  if (no) parts.push(`<span class="crumb plain">第${no}课</span>`);
  els.crumbs.innerHTML = parts.join('<span class="sep">›</span>');
  els.title.textContent = QUIZ.title || '';
  els.sub.textContent = QUIZ.subtitle || '';
  els.ver.textContent = 'quiz · v' + (QUIZ.version || '?');
  els.summary.innerHTML = (QUIZ.summary || []).map(s => `<li>${s}</li>`).join('');
}

let state = { i: 0, score: 0, total: QUIZ.questions.length };

function renderQuestion() {
  const q = QUIZ.questions[state.i];
  els.count.textContent = `${state.i + 1} / ${state.total}`;
  els.fill.style.width = `${(state.i / state.total) * 100}%`;

  const opts = q.options.map((o, idx) => {
    const key = String.fromCharCode(65 + idx);
    return `<button class="opt" data-idx="${idx}">
      <span class="key">${key}</span><span>${o}</span>
    </button>`;
  }).join('');

  els.quiz.innerHTML = `
    <div class="card" id="card">
      <div class="qhead">
        <span class="qnum">第 ${state.i + 1} 题</span>
        <span class="src">📖 ${q.source || ''}</span>
      </div>
      <div class="stem">${q.stem}</div>
      <div class="opts">${opts}</div>
      <div class="explain" id="explain"></div>
      <button class="next" id="next" disabled>${state.i + 1 === state.total ? '查看成绩' : '下一题 →'}</button>
    </div>`;

  els.quiz.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => answer(Number(btn.dataset.idx)));
  });
  els.quiz.querySelector('#next').addEventListener('click', next);
}

function answer(pick) {
  const q = QUIZ.questions[state.i];
  const btns = els.quiz.querySelectorAll('.opt');
  const expl = els.quiz.querySelector('#explain');
  const nextBtn = els.quiz.querySelector('#next');

  btns.forEach((b, idx) => {
    b.disabled = true;
    if (idx === q.answer) b.classList.add('correct');
    else if (idx === pick) b.classList.add('wrong');
  });

  const right = pick === q.answer;
  if (right) state.score++;

  expl.className = 'explain show ' + (right ? 'ok' : 'no');
  expl.innerHTML = `
    <div class="headline">${right ? '✓ 正确' : '✗ 正确答案是 ' + String.fromCharCode(65 + q.answer)}</div>
    <div class="trans"><span class="tlbl">译文</span><span>${q.translation || ''}</span></div>
    <div>${q.explain}</div>
    <div class="tip">${q.tip || ''}</div>`;
  nextBtn.disabled = false;
}

function next() {
  state.i++;
  if (state.i < state.total) renderQuestion();
  else renderResult();
}

function renderResult() {
  els.quiz.style.display = 'none';
  document.querySelector('.summary').style.display = 'none';
  els.fill.style.width = '100%';
  els.count.textContent = `${state.total} / ${state.total}`;

  const pct = Math.round((state.score / state.total) * 100);
  const R = 56, C = 2 * Math.PI * R;
  els.result.style.display = 'block';
  els.result.innerHTML = `
    <span class="mascot">${pct >= 80 ? '🎉' : pct >= 60 ? '💪' : '🌱'}</span>
    <svg class="ring" viewBox="0 0 132 132">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ff6f9c"></stop>
          <stop offset="100%" stop-color="#a18cff"></stop>
        </linearGradient>
      </defs>
      <circle class="bg" cx="66" cy="66" r="${R}"></circle>
      <circle class="val" cx="66" cy="66" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"></circle>
      <text x="50%" y="58%" text-anchor="middle">${pct}%</text>
    </svg>
    <h2>${state.score} / ${state.total} 题答对</h2>
    <p>${pct >= 80 ? '掌握得很好，保持这个状态。' : pct >= 60 ? '不错，再回顾一下错题的知识点。' : '先回笔记过一遍知识点，再来刷一轮。'}</p>
    <button class="again" onclick="location.reload()">再来一轮</button>`;

  requestAnimationFrame(() => {
    const circle = els.result.querySelector('.val');
    circle.style.strokeDashoffset = String(C * (1 - pct / 100));
  });
}

renderSummary();
renderQuestion();
</script>
</body>
